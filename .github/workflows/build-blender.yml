name: Build Preshburg Blender Model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build_preshburg.py"
      - ".github/workflows/build-blender.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          URL="https://download.blender.org/release/Blender4.5/blender-4.5.4-linux-x64.tar.xz"
          wget -q "$URL" -O blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_DIR=$(find . -maxdepth 1 -type d -name 'blender-*' | head -n 1)
          test -n "$BLENDER_DIR"
          mv "$BLENDER_DIR" blender
          ./blender/blender --version

      - name: Build and render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output
          mkdir -p output
          ./blender/blender --background --factory-startup --python-exit-code 1 --python "$GITHUB_WORKSPACE/build_preshburg.py"
          echo "Generated files:"
          find "$GITHUB_WORKSPACE/output" -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort

      - name: Validate outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s output/Preshburg_Blvd_Unit_401.blend
          for f in forest_front.png strelisk_ct.png preshburg_blvd.png aerial_corner.png rear_porch_side.png; do
            test -s "output/$f"
          done
          echo "All required outputs exist."

      - name: Upload complete model package
        uses: actions/upload-artifact@v4
        with:
          name: Preshburg-Blvd-Unit-401-Complete
          path: output/
          if-no-files-found: error
          retention-days: 30
